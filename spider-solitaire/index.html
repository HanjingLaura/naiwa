<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#2f7d4a"/><title>奶娃纸牌 · Naiwa Spider Solitaire</title>
<link rel="icon" href="./assets/suit-spade.webp"/></head>
<body><div id="app">
<header id="bar">
  <div class="title">奶娃纸牌</div>
  <div class="stats"><span>分数 <b id="score">500</b></span><span>步数 <b id="moves">0</b></span><span>完成 <b id="done">0</b>/8</span></div>
  <div class="btns">
    <select id="diff" title="难度"><option value="1">1 花色</option><option value="2">2 花色</option><option value="4">4 花色</option></select>
    <button id="new">新局</button><button id="undo">撤销</button><button id="hint">提示</button>
  </div>
</header>
<main id="board"></main>
<div id="win" hidden><div class="wincard"><img src="./assets/win.webp" alt=""/><h2>奶娃赢啦！</h2><p id="winscore"></p><button id="again">再来一局</button></div></div>
</div><script type="module" src="/src/main.ts"></script></body></html>
